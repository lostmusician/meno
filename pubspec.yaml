name: meno
description: A private, local-first daily journal and binder.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  text_analysis: 1.0.0+2
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_onnxruntime: ^1.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
