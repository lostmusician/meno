name: meno
description: A private, local-first daily journal and binder.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  text_analysis: 1.0.0+2
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_onnxruntime: ^1.8.4
  archive: ^3.6.1
  file_selector: ^1.0.3
  package_info_plus: ^8.3.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/meno-mark-sage.png
    - assets/brand/meno-wordmark-sage.png
